# 本地开发: cp config.example.yaml config.yaml (config.yaml 已 gitignore)
# 密钥不要写在这里, 放 .env (见 .env.example)

name: python-agent
environment: dev

log:
  level: INFO
  target: console
  file_dir: ./logs

server:
  grpc:
    host: 0.0.0.0
    port: 50051
    max_workers: 10
    shutdown_grace: 5

provider_catalog:
  dir: ./providers/catalog
