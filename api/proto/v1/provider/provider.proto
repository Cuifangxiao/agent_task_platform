syntax = "proto3";

package provider.v1;

option go_package = "agent-task-platform/api/go/v1/provider;providerv1";

service ProviderRuntimeService {
  rpc TestCredential(TestCredentialRequest) returns (TestCredentialResponse);
}

message UserContext {
  int64 user_id = 1;
  string username = 2;
  string session_id = 3;
  string device = 4;
}

message TestCredentialRequest {
  UserContext user = 1;
  string provider = 2;
  string api_key = 3;
  string base_url = 4;
}

message TestCredentialResponse {
  string request_id = 1;
  string provider = 2;
  string status = 3;
  string message = 4;
}
