name: deepseek
display_name: DeepSeek
description: DeepSeek OpenAI-compatible chat API.
manager: deepseek
sdk: langchain_openai
default_base_url: https://api.deepseek.com
supports_custom_base_url: true
request_timeout_seconds: 180
structured_output_method: json_mode
credential_test:
  enabled: true
  model: deepseek-v4-flash
  prompt: Reply with OK.
  max_tokens: 8
models:
  - id: deepseek-v4-flash
    model_name: deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    type: text
    parameters:
      - name: thinking
        display_name: Thinking mode
        type: enum
        description: 开启后模型会先进行推理，再输出最终回答。
        default: enabled
        options: [enabled, disabled]
      - name: reasoning_effort
        display_name: Reasoning effort
        type: enum
        description: 仅在思考模式开启时生效；High 适合常规任务，Max 适合复杂任务。
        default: high
        options: [high, max]
      - name: temperature
        display_name: Temperature
        type: number
        description: 控制输出随机度；思考模式开启时 DeepSeek 会忽略此参数。
        default: 1
        min: 0
        max: 2
      - name: max_tokens
        display_name: Max tokens
        type: integer
        description: 限制单次生成的最大输出长度。
        default: 4096
        min: 1
        max: 384000
  - id: deepseek-v4-pro
    model_name: deepseek-v4-pro
    display_name: DeepSeek V4 Pro
    type: text
    parameters:
      - name: thinking
        display_name: Thinking mode
        type: enum
        description: 开启后模型会先进行推理，再输出最终回答。
        default: enabled
        options: [enabled, disabled]
      - name: reasoning_effort
        display_name: Reasoning effort
        type: enum
        description: 仅在思考模式开启时生效；High 适合常规任务，Max 适合复杂任务。
        default: high
        options: [high, max]
      - name: temperature
        display_name: Temperature
        type: number
        description: 控制输出随机度；思考模式开启时 DeepSeek 会忽略此参数。
        default: 1
        min: 0
        max: 2
      - name: max_tokens
        display_name: Max tokens
        type: integer
        description: 限制单次生成的最大输出长度。
        default: 4096
        min: 1
        max: 384000
